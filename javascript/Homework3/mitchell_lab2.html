        <script>

        function Calculator() {

            var first = prompt("Enter the first number:");
            var second = prompt("Enter the second number:");

            first = parseFloat(first);
            second = parseFloat(second);
            
            var sum = findSum(first, second);
            alert("The sum is: " + sum);
        }

        function findSum(a, b) {
            var result = a + b;
            return result;
        }
    </script>
